<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de matrices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Calculadora de matrices</h1>
  <p class="intro">Agrega las matrices que necesites, escoge su tamaño y escribe los valores. Puedes sumarlas o restarlas entre sí y sacar el determinante de cada una con el procedimiento. Acepta enteros, decimales (con punto o coma) y fracciones como 1/3.</p>

  <section aria-labelledby="t-mats">
    <h2 id="t-mats">Tus matrices</h2>
    <div class="matrices" id="matrices"></div>
  </section>

  <section aria-labelledby="t-op">
    <h2 id="t-op">Sumar o restar</h2>
    <div class="op-row">
      <select id="selX" aria-label="Primera matriz"></select>
      <select id="selOp" aria-label="Operación">
        <option value="+">+</option>
        <option value="-">−</option>
      </select>
      <select id="selY" aria-label="Segunda matriz"></select>
      <button class="primary" id="btnCalc">Calcular</button>
    </div>
    <div id="opOut" aria-live="polite"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
